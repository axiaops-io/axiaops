# Self-hosted AxiaOps from published GHCR images. Sibling to
# deploy/helm/axiaops for non-k8s hosts. Repo-root docker-compose.yml is the
# build-from-source dev loop instead.
#
# Quick start (from repo root):
#   cp deploy/docker/.env.example deploy/docker/.env
#   docker compose -f deploy/docker/docker-compose.yml --env-file deploy/docker/.env up -d
#
# Role bootstrap (docs/AUTHENTICATION.md §5): axiaops_owner (schema owner)
# runs the one-off `migrate` job, which creates axiaops (app role) and
# axiaops_runtime (RLS-bypass runtime role). migrate must finish before
# api/ingestion start.
#
# DEV_MODE is hardcoded false. GHCR images are always the production shape
# (DEV_MODE compiled out) — AXIAOPS_IMAGE_SUFFIX defaults to empty.

services:

  postgres:
    image: postgres:17.5-alpine
    container_name: axiaops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: axiaops
      POSTGRES_USER: axiaops_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD}
    volumes:
      - axiaops_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiaops_owner -d axiaops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: valkey/valkey:8.1-alpine
    container_name: axiaops-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}

  migrate:
    image: ${AXIAOPS_REGISTRY:-ghcr.io/axiaops-io/axiaops}/migrate:${AXIAOPS_VERSION:?set AXIAOPS_VERSION to a release tag from https://github.com/axiaops-io/axiaops/releases}
    container_name: axiaops-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://axiaops:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/axiaops?sslmode=${POSTGRES_SSLMODE:-disable}
      MIGRATION_DATABASE_URL: postgres://axiaops_owner:${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/axiaops?sslmode=${POSTGRES_SSLMODE:-disable}
      RUNTIME_ADMIN_DATABASE_URL: postgres://axiaops_runtime:${POSTGRES_RUNTIME_PASSWORD:?set POSTGRES_RUNTIME_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/axiaops?sslmode=${POSTGRES_SSLMODE:-disable}
      APP_VERSION: ${AXIAOPS_VERSION:?set AXIAOPS_VERSION to a release tag from https://github.com/axiaops-io/axiaops/releases}
    depends_on:
      postgres:
        condition: service_healthy

  ingestion:
    image: ${AXIAOPS_REGISTRY:-ghcr.io/axiaops-io/axiaops}/ingestion:${AXIAOPS_VERSION:?set AXIAOPS_VERSION to a release tag from https://github.com/axiaops-io/axiaops/releases}${AXIAOPS_IMAGE_SUFFIX:-}
    container_name: axiaops-ingestion
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://axiaops:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/axiaops?sslmode=${POSTGRES_SSLMODE:-disable}
      RUNTIME_ADMIN_DATABASE_URL: postgres://axiaops_runtime:${POSTGRES_RUNTIME_PASSWORD:?set POSTGRES_RUNTIME_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/axiaops?sslmode=${POSTGRES_SSLMODE:-disable}
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?set ENCRYPTION_KEY, generate with openssl rand -hex 32}"
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      DEV_MODE: "false"
      LOG_OUTPUT: json
      INGESTION_SHARED_SECRET: "${INGESTION_SHARED_SECRET:?set INGESTION_SHARED_SECRET, generate with openssl rand -hex 32}"
      INGESTION_SHARED_SECRET_NEXT: ${INGESTION_SHARED_SECRET_NEXT:-}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60m}
    volumes:
      # Omit if every connected account uses RoleARN instead of static keys.
      - ${AWS_CREDENTIALS_DIR:-~/.aws}:/root/.aws:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    image: ${AXIAOPS_REGISTRY:-ghcr.io/axiaops-io/axiaops}/api:${AXIAOPS_VERSION:?set AXIAOPS_VERSION to a release tag from https://github.com/axiaops-io/axiaops/releases}${AXIAOPS_IMAGE_SUFFIX:-}
    container_name: axiaops-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://axiaops:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/axiaops?sslmode=${POSTGRES_SSLMODE:-disable}
      RUNTIME_ADMIN_DATABASE_URL: postgres://axiaops_runtime:${POSTGRES_RUNTIME_PASSWORD:?set POSTGRES_RUNTIME_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/axiaops?sslmode=${POSTGRES_SSLMODE:-disable}
      INGESTION_URL: http://ingestion:8081
      API_ADDR: ":8080"
      # Required for OIDC redirect_uri and invite/reset links.
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST to your externally-reachable https URL}
      # Only for cross-origin dashboard/api hosts; empty = same-origin.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?set ENCRYPTION_KEY, generate with openssl rand -hex 32}"
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      DEV_MODE: "false"
      LOG_OUTPUT: json
      INGESTION_SHARED_SECRET: "${INGESTION_SHARED_SECRET:?set INGESTION_SHARED_SECRET, generate with openssl rand -hex 32}"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-AxiaOps}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  dashboard:
    image: ${AXIAOPS_REGISTRY:-ghcr.io/axiaops-io/axiaops}/dashboard:${AXIAOPS_VERSION:?set AXIAOPS_VERSION to a release tag from https://github.com/axiaops-io/axiaops/releases}
    container_name: axiaops-dashboard
    restart: unless-stopped
    environment:
      DEV_MODE: "false"
    ports:
      # Plain HTTP — put a TLS-terminating reverse proxy in front.
      - "${DASHBOARD_PORT:-8082}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  axiaops_pg_data:
